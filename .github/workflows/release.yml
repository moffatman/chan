name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/release-key.jks \
            -alias chan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass chanrelease -keypass chanrelease \
            -dname "CN=Chan Fork, OU=Dev, O=Fork, L=Unknown, ST=Unknown, C=US"

      - name: Write key.properties
        run: |
          cat > android/key.properties <<KEYEOF
          storePassword=chanrelease
          keyPassword=chanrelease
          keyAlias=chan
          storeFile=../release-key.jks
          KEYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/chan-${{ github.event.inputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Chan ${{ github.event.inputs.tag }}
          body: |
            ## Changes
            - Fix Android image picker not showing third-party gallery apps (#312)
            - Pause video when thumbnail grid opens (#284)
            - Add kohlchan.net, krautchan.org, ejchan.net support (#289, #285, #306)
          files: build/app/outputs/flutter-apk/chan-${{ github.event.inputs.tag }}.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
